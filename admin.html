<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin | Bay State Make-Ready</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,600&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .wo-card { background: var(--paper-white); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 20px; overflow: hidden; }
  .wo-head { padding: 18px 22px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; gap: 16px; flex-wrap: wrap; }
  .wo-head:hover { background: var(--kraft); }
  .wo-status-badge { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 10px; border-radius: 20px; background: var(--kraft); color: var(--ink-soft); }
  .wo-status-badge.new { background: rgba(31,59,87,0.1); color: var(--blueprint); }
  .wo-status-badge.quoted { background: rgba(169,134,62,0.15); color: var(--amber-dark); }
  .wo-status-badge.scheduled { background: rgba(63,107,84,0.12); color: var(--sage); }
  .wo-status-badge.in_progress { background: rgba(63,107,84,0.2); color: var(--sage); }
  .wo-status-badge.completed { background: var(--blueprint); color: white; }
  .wo-body { padding: 0 22px 22px; border-top: 1px solid var(--line); display: none; }
  .wo-body.open { display: block; }
  .wo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 18px 0; }
  .wo-field-label { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); display: block; margin-bottom: 4px; }
  .line-row { display: grid; grid-template-columns: 1fr 60px 90px 90px 30px; gap: 8px; margin-bottom: 8px; align-items: center; }
  .line-row input { padding: 8px; border: 1px solid var(--line); border-radius: 4px; font-size: 0.85rem; }
  .remove-line { background: none; border: none; color: var(--rust); cursor: pointer; font-size: 1.1rem; }
  .totals-row { display: flex; justify-content: flex-end; gap: 14px; align-items: center; margin-top: 6px; font-size: 0.9rem; }
  .totals-row input { width: 100px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; text-align: right; }
  .status-buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .status-buttons button { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; padding: 8px 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--paper-white); cursor: pointer; }
  .status-buttons button.active { background: var(--blueprint); color: white; border-color: var(--blueprint); }
  #loginView { max-width: 380px; margin: 100px auto; }
  #dashView { display: none; }
</style>
</head>
<body>

<header class="site">
  <div class="nav-row">
    <a href="index.html" class="logo"><svg class="brand-mark" width="30" height="30" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><line x1="3" y1="35" x2="45" y2="35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9 35V21L12 13L15 21V35" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M29 35V17L33 6L37 17V35" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M12 13L4 35M12 13L9 35M12 13L15 35M12 13L20 35" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.55"/><path d="M33 6L22 35M33 6L27 35M33 6L33 35M33 6L39 35M33 6L44 35" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.55"/><path d="M39 8.5L40 11L42.5 12L40 13L39 15.5L38 13L35.5 12L38 11Z" fill="#D9A94A"/><path d="M16 16.5L16.6 18L18.1 18.6L16.6 19.2L16 20.7L15.4 19.2L13.9 18.6L15.4 18Z" fill="#D9A94A"/></svg>Bay State<span class="dot">•</span>Make-Ready <span style="font-family:var(--font-mono); font-size:0.7rem; color:var(--amber); margin-left:4px;">ADMIN</span></a>
    <nav class="links" style="display:flex;">
      <a href="index.html">View Site</a>
      <a href="#" id="logoutLink" style="display:none;">Log Out</a>
    </nav>
  </div>
</header>

<!-- LOGIN -->
<section id="loginView">
  <div class="wrap">
    <span class="eyebrow">Admin Access</span>
    <h1 style="font-size:1.8rem;">Log In</h1>
    <div class="ticket" style="padding:28px; margin-top:24px;">
      <div class="form-row">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@baystatemakeready.com">
      </div>
      <div class="form-row">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword">
      </div>
      <div id="loginError" style="color:var(--rust); font-size:0.85rem; margin-bottom:12px; display:none;"></div>
      <button class="btn btn-primary" id="loginBtn" style="width:100%; justify-content:center;">Log In</button>
    </div>
  </div>
</section>

<!-- DASHBOARD -->
<section id="dashView">
  <div class="wrap">
    <span class="eyebrow">Work Order Tracker</span>
    <h1 style="font-size:1.8rem;">All Work Orders</h1>
    <div style="margin:20px 0;">
      <label class="wo-field-label">Filter by status</label>
      <select id="statusFilter" style="padding:8px; border:1px solid var(--line); border-radius:4px;">
        <option value="">All</option>
        <option value="new">New</option>
        <option value="quoted">Quoted</option>
        <option value="scheduled">Scheduled</option>
        <option value="in_progress">In Progress</option>
        <option value="completed">Completed</option>
      </select>
    </div>
    <div id="workOrderList">Loading…</div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://yspahqdbuqnmzvvpszaj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_FhRg-Dks5hnsNCw9_opYvA_PDUkT7kE';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STATUSES = ['new', 'quoted', 'scheduled', 'in_progress', 'completed'];
const STATUS_LABELS = { new: 'New', quoted: 'Quoted', scheduled: 'Scheduled', in_progress: 'In Progress', completed: 'Completed' };

let workOrders = [];

function money(n) { return '$' + (Number(n) || 0).toFixed(2); }

function computeTotals(lineItems, adjustments, amountPaid) {
  const subtotal = lineItems.reduce((s, li) => s + (Number(li.qty) || 0) * (Number(li.unit_price) || 0), 0);
  const balance = subtotal + (Number(adjustments) || 0) - (Number(amountPaid) || 0);
  return { subtotal, balance };
}

function renderLineRows(wo) {
  const items = wo.line_items && wo.line_items.length ? wo.line_items : [{ description: '', qty: 1, unit_price: 0 }];
  return items.map((li, i) => `
    <div class="line-row" data-idx="${i}">
      <input type="text" class="li-desc" placeholder="Description" value="${(li.description || '').replace(/"/g, '&quot;')}">
      <input type="number" class="li-qty" placeholder="Qty" value="${li.qty || 1}" min="0" step="1">
      <input type="number" class="li-price" placeholder="Price" value="${li.unit_price || 0}" min="0" step="0.01">
      <span class="li-total" style="font-family:var(--font-mono); font-size:0.85rem;">${money((li.qty || 0) * (li.unit_price || 0))}</span>
      <button class="remove-line" data-action="remove-line" title="Remove">✕</button>
    </div>
  `).join('');
}

function renderCard(wo) {
  const totals = computeTotals(wo.line_items || [], wo.adjustments, wo.amount_paid);
  return `
    <div class="wo-card" data-id="${wo.id}">
      <div class="wo-head" data-action="toggle">
        <div>
          <strong>${wo.customer_name || '(no name)'}</strong>
          <span class="ticket-no" style="margin-left:10px;">${new Date(wo.created_at).toLocaleDateString()}</span>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span style="font-size:0.85rem; color:var(--ink-soft);">${wo.service_needed || ''}</span>
          <span class="wo-status-badge ${wo.status}">${STATUS_LABELS[wo.status] || wo.status}</span>
        </div>
      </div>
      <div class="wo-body" id="body-${wo.id}">
        <div class="wo-grid">
          <div>
            <span class="wo-field-label">Email</span>
            <div>${wo.customer_email || '—'}</div>
          </div>
          <div>
            <span class="wo-field-label">Phone</span>
            <div>${wo.customer_phone || '—'}</div>
          </div>
          <div>
            <span class="wo-field-label">Address</span>
            <div>${wo.customer_address || '—'}</div>
          </div>
          <div>
            <span class="wo-field-label">Client Type / Occupancy</span>
            <div>${wo.client_type || '—'} / ${wo.occupancy || '—'}</div>
          </div>
        </div>
        <div>
          <span class="wo-field-label">Notes</span>
          <div style="font-size:0.9rem;">${wo.notes || '—'}</div>
        </div>

        <hr class="divider-dash" style="margin:18px 0;">

        <span class="wo-field-label">Line Items</span>
        <div class="line-items-container" style="margin-top:10px;">
          ${renderLineRows(wo)}
        </div>
        <button class="btn btn-ghost" data-action="add-line" style="padding:8px 14px; font-size:0.75rem; margin-top:6px;">+ Add Line</button>

        <div class="totals-row">
          <span>Subtotal: <strong class="subtotal-display">${money(totals.subtotal)}</strong></span>
        </div>
        <div class="totals-row">
          <label>Adjustments</label>
          <input type="number" class="adj-input" step="0.01" value="${wo.adjustments || 0}">
        </div>
        <div class="totals-row">
          <label>Amount Paid</label>
          <input type="number" class="paid-input" step="0.01" value="${wo.amount_paid || 0}">
        </div>
        <div class="totals-row">
          <span>Balance Due: <strong class="balance-display">${money(totals.balance)}</strong></span>
        </div>

        <button class="btn btn-primary" data-action="save-pricing" style="margin-top:14px; padding:10px 18px; font-size:0.8rem;">Save Pricing</button>

        <div style="margin-top:16px;">
          <span class="wo-field-label">Appointment Date &amp; Time (required to set status to Scheduled)</span>
          <input type="datetime-local" class="schedule-datetime" style="padding:8px; border:1px solid var(--line); border-radius:4px; margin-top:6px;"
            value="${wo.scheduled_date ? new Date(wo.scheduled_date).toISOString().slice(0,16) : ''}">
        </div>

        <div class="status-buttons">
          ${STATUSES.map(s => `<button data-action="set-status" data-status="${s}" class="${wo.status === s ? 'active' : ''}">${STATUS_LABELS[s]}</button>`).join('')}
        </div>
        ${wo.quoted_at ? `<p style="font-size:0.78rem; color:var(--ink-soft); margin-top:10px;">Quote sent ${new Date(wo.quoted_at).toLocaleString()} <button data-action="resend-quote" style="margin-left:8px; font-family:var(--font-mono); font-size:0.7rem; padding:4px 10px; border-radius:12px; border:1px solid var(--line); background:var(--paper-white); cursor:pointer;">Resend Quote</button></p>` : ''}
        ${wo.invoiced_at ? `<p style="font-size:0.78rem; color:var(--ink-soft);">Invoice sent ${new Date(wo.invoiced_at).toLocaleString()} <button data-action="resend-invoice" style="margin-left:8px; font-family:var(--font-mono); font-size:0.7rem; padding:4px 10px; border-radius:12px; border:1px solid var(--line); background:var(--paper-white); cursor:pointer;">Resend Invoice</button></p>` : ''}
        ${wo.scheduled_notified_at ? `<p style="font-size:0.78rem; color:var(--ink-soft);">Calendar invite sent ${new Date(wo.scheduled_notified_at).toLocaleString()}</p>` : ''}
      </div>
    </div>
  `;
}

function renderList() {
  const filter = document.getElementById('statusFilter').value;
  const filtered = filter ? workOrders.filter(w => w.status === filter) : workOrders;
  const container = document.getElementById('workOrderList');
  container.innerHTML = filtered.length ? filtered.map(renderCard).join('') : '<p>No work orders yet.</p>';
}

async function loadWorkOrders() {
  const { data, error } = await sb.from('work_orders').select('*').order('created_at', { ascending: false });
  if (error) {
    document.getElementById('workOrderList').innerHTML = '<p style="color:var(--rust);">Failed to load: ' + error.message + '</p>';
    return;
  }
  workOrders = data.map(w => ({ ...w, line_items: w.line_items || [] }));
  renderList();
}

function getLineItemsFromCard(card) {
  return Array.from(card.querySelectorAll('.line-row')).map(row => ({
    description: row.querySelector('.li-desc').value,
    qty: Number(row.querySelector('.li-qty').value) || 0,
    unit_price: Number(row.querySelector('.li-price').value) || 0
  }));
}

document.getElementById('workOrderList').addEventListener('click', async function (e) {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const card = e.target.closest('.wo-card');
  const id = card.getAttribute('data-id');
  const action = btn.getAttribute('data-action');

  if (action === 'toggle') {
    document.getElementById('body-' + id).classList.toggle('open');
  }

  if (action === 'remove-line') {
    btn.closest('.line-row').remove();
  }

  if (action === 'add-line') {
    const container = card.querySelector('.line-items-container');
    container.insertAdjacentHTML('beforeend', `
      <div class="line-row">
        <input type="text" class="li-desc" placeholder="Description" value="">
        <input type="number" class="li-qty" placeholder="Qty" value="1" min="0" step="1">
        <input type="number" class="li-price" placeholder="Price" value="0" min="0" step="0.01">
        <span class="li-total" style="font-family:var(--font-mono); font-size:0.85rem;">$0.00</span>
        <button class="remove-line" data-action="remove-line" title="Remove">✕</button>
      </div>
    `);
  }

  if (action === 'save-pricing') {
    const lineItems = getLineItemsFromCard(card);
    const adjustments = Number(card.querySelector('.adj-input').value) || 0;
    const amountPaid = Number(card.querySelector('.paid-input').value) || 0;
    const totals = computeTotals(lineItems, adjustments, amountPaid);
    btn.textContent = 'Saving…';
    const { error } = await sb.from('work_orders').update({
      line_items: lineItems,
      adjustments: adjustments,
      amount_paid: amountPaid,
      subtotal: totals.subtotal,
      balance_due: totals.balance
    }).eq('id', id);
    btn.textContent = error ? 'Failed — try again' : 'Saved ✓';
    if (!error) await loadWorkOrders();
  }

  if (action === 'set-status') {
    const newStatus = btn.getAttribute('data-status');
    const updates = { status: newStatus };

    if (newStatus === 'scheduled') {
      const dtInput = card.querySelector('.schedule-datetime');
      if (!dtInput.value) {
        alert('Please pick an appointment date and time before marking this Scheduled.');
        return;
      }
      updates.scheduled_date = new Date(dtInput.value).toISOString();
      updates.scheduled_notified_at = null; // allow re-sending if date changes later
    }

    const { error } = await sb.from('work_orders').update(updates).eq('id', id);
    if (error) {
      alert('Failed to update status: ' + error.message);
    } else {
      await loadWorkOrders();
      document.getElementById('body-' + id).classList.add('open');
    }
  }

  if (action === 'resend-quote') {
    btn.textContent = 'Resending…';
    const { error } = await sb.from('work_orders').update({ quoted_at: null }).eq('id', id);
    if (error) {
      alert('Failed to resend: ' + error.message);
    } else {
      await loadWorkOrders();
      document.getElementById('body-' + id).classList.add('open');
    }
  }

  if (action === 'resend-invoice') {
    btn.textContent = 'Resending…';
    const { error } = await sb.from('work_orders').update({ invoiced_at: null }).eq('id', id);
    if (error) {
      alert('Failed to resend: ' + error.message);
    } else {
      await loadWorkOrders();
      document.getElementById('body-' + id).classList.add('open');
    }
  }
});

// Live recalculation as the admin types or tabs between fields —
// no need to click Save just to see updated totals.
document.getElementById('workOrderList').addEventListener('input', function (e) {
  const card = e.target.closest('.wo-card');
  if (!card) return;
  if (
    !e.target.classList.contains('li-qty') &&
    !e.target.classList.contains('li-price') &&
    !e.target.classList.contains('adj-input') &&
    !e.target.classList.contains('paid-input')
  ) return;

  // update each row's own total display
  card.querySelectorAll('.line-row').forEach(row => {
    const qty = Number(row.querySelector('.li-qty').value) || 0;
    const price = Number(row.querySelector('.li-price').value) || 0;
    row.querySelector('.li-total').textContent = money(qty * price);
  });

  const lineItems = getLineItemsFromCard(card);
  const adjustments = Number(card.querySelector('.adj-input').value) || 0;
  const amountPaid = Number(card.querySelector('.paid-input').value) || 0;
  const totals = computeTotals(lineItems, adjustments, amountPaid);
  card.querySelector('.subtotal-display').textContent = money(totals.subtotal);
  card.querySelector('.balance-display').textContent = money(totals.balance);
});

document.getElementById('statusFilter').addEventListener('change', renderList);

// ---- Auth ----
async function checkSession() {
  const { data } = await sb.auth.getSession();
  if (data.session) {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('dashView').style.display = 'block';
    document.getElementById('logoutLink').style.display = 'inline';
    loadWorkOrders();
  } else {
    document.getElementById('loginView').style.display = 'block';
    document.getElementById('dashView').style.display = 'none';
    document.getElementById('logoutLink').style.display = 'none';
  }
}

document.getElementById('loginBtn').addEventListener('click', async function () {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const errBox = document.getElementById('loginError');
  errBox.style.display = 'none';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    errBox.textContent = error.message;
    errBox.style.display = 'block';
  } else {
    checkSession();
  }
});

document.getElementById('logoutLink').addEventListener('click', async function (e) {
  e.preventDefault();
  await sb.auth.signOut();
  checkSession();
});

checkSession();
</script>
</body>
</html>
